name: privacy-cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/privacy-cleanup.yml'
  issues:
    types: [opened]

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  sanitize:
    if: ${{ github.event_name == 'push' || (github.event.issue.title == '[PRIVACY-CLEANUP]' && github.actor == github.repository_owner) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite active public history with bot noreply identity
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan sanitized-main
          git rm -rf --cached . >/dev/null 2>&1 || true
          printf 'Repository history sanitized to remove personal commit email from the active branch.\n' > .privacy-cleanup-done
          git add -A
          git commit -m 'Sanitize repository history'
          git push origin HEAD:main --force

      - name: Remove completed legacy workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$GITHUB_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.status == "completed") | .id' |
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "$current" ] && continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" || true
          done

      - name: Close cleanup trigger issue
        if: ${{ always() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            -f body='Privacy cleanup completed.' \
            -f state='closed' >/dev/null
