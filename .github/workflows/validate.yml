name: validator-ci

on:
  push:
    branches: [main]
    paths:
      - 'validator.py'
      - 'tests/**'
      - 'examples/**'
      - 'config.example.json'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Known-good validation
        run: |
          python validator.py \
            --bank examples/bank.valid.json \
            --manifest examples/manifest.valid.json \
            --semantic-review examples/semantic_review.valid.json \
            --config config.example.json \
            --output /tmp/result.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/result.json', encoding='utf-8'))
          assert result['status'] == 'PASS', result
          print('VALIDATOR_SELFTEST=PASS')
          PY
